name: 🌍 Deploy Vite Portfolio via FTPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 🔨 Build Job
  build:
    name: build 
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@main

      - name: 🟢 Setup Node
        uses: actions/setup-node@main
        with:
          node-version: 20.x

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Vite Project
        run: npm run build

      - name: ✅ Verify dist folder exists
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Dist folder not found! Did 'npm run build' fail?"
            exit 1
          fi
          echo "✅ Dist folder exists."

      - name: 📝 List dist files
        run: ls -R dist

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@main
        with:
          name: production-file
          path: dist/*

  # 🚀 Deploy Job
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@main
        with:
          name: production-file
          path: ./dist

      - name: 🔐 Test FTPS Login
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          echo "Testing FTPS login..."
          lftp -u '${{ secrets.FTP_PASSWORD }}' ' info@launit.com ', ftps://ftp.launit.com -e "set net:timeout 30; set ssl:verify-cert no; ls; quit"

      - name: 🌍 Deploy to FTPS Server
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ftp.launit.com
          username: info@launit.com
          password: ${{ secrets.ftp_password }}
          port: 21
          protocol: ftp
          local-dir: ./dist
          server-dir: /new/
          args: '--no-check-certificate'
