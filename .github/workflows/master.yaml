name: 🌍 Deploy Vite Portfolio via FTP

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v3

      - name: 🟢 Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20.x

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build Vite Project
        run: npm run build

      - name: ✅ Verify dist folder exists
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Dist folder not found! Did 'npm run build' fail?"
            exit 1
          fi
          echo "✅ Dist folder exists."

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-file
          path: dist/*

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: production-file
          path: ./dist

      - name: ⚡ Test FTP connectivity
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          echo "Testing FTP login..."
          # -e 'quit' ensures lftp exits immediately
          lftp -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' ftp://ftp.launit.com -e "ls; quit" || exit 1

      - name: 🌍 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist
          server-dir: /portfolio/
